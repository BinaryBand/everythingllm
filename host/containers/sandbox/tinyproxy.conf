Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 20
LogLevel Connect
# Only sandboxes on sandbox-net may use the proxy.
Allow 10.89.77.0/24
# Hosts not matched by a line in the allowlist are refused.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
DisableViaHeader Yes
