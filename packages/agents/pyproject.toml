[project]
name = "agents"
version = "0.1.0"
description = "Delegation on the host: runs tasks a caller defines as AnythingLLM's own agents, headless, in workspaces set up per role, with a live card and a run log"
requires-python = ">=3.12"
dependencies = ["hostctl", "hostrpc", "httpx>=0.27", "runs"]

[project.scripts]
agents-runner = "agents.runner:main"
agents-run = "agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
