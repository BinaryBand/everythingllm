[project]
name = "audit"
version = "0.1.0"
description = "MCP server with health checks over the AnythingLLM setup, for the System Audit job"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "pydantic>=2", "hostrpc", "sites"]

[project.scripts]
audit-mcp = "audit.server:mcp.run"
audit-runner = "audit.tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
