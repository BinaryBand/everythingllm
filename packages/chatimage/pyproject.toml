[project]
name = "chatimage"
version = "0.1.0"
description = "Chat images: link cards, live progress cards and the server push that keeps a live one current, drawn on the host for the agent to show as Markdown"
requires-python = ">=3.12"
dependencies = ["hostrpc", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
