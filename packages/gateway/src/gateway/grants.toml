# Which tools each MCP gateway client may see and call (gateway.grants; the README's "MCP
# gateway"). A client is named as its token is in ~/.config/everythingllm/gateway.env
# (GATEWAY_TOKEN_CLAUDE_CODE is claude-code); the tokens stay there, never here. A client
# with a token but no entry here gets no tools. The gateway reads this when it starts, so
# restart it after a change (systemctl --user restart gateway).
#
#   [clients.<name>]
#   tools = ["<group>", ...]
#
# The groups:
#   sites                    the sites front's read tools, the ones AnythingLLM's agent has
#   sites:write              write_entry, delete_entry
#   agents                   delegations to AnythingLLM's own agents (agents_*), each
#                            client's its own
#   research                 deep research runs (research_*): not per client, so a client
#                            granted it sees every run, AnythingLLM's too
#   sandbox                  the code sandbox (sandbox_*), in the client's own workspace,
#                            client-<name>, which reads every workspace's /shared

[clients.claude-code]
tools = [
  "sites",
  "sites:write",
  "agents",
  "research",
  "sandbox",
]
