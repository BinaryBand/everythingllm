[project]
name = "hostctl"
version = "0.1.0"
description = "uv run hostctl <command>: set up, sync and check this machine (the apps registry, units, deploys, app setup, the restart guard; standard library only)"
requires-python = ">=3.12"
dependencies = ["hostenv"]

[project.scripts]
hostctl = "hostctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
