# The apps this repo runs, and everything hostctl needs to know to deploy, restart, map,
# check and follow them. hostctl's units, run_guard and appctl (uv run hostctl <app>-setup,
# <app>-logs, routes, install, health) read it through
# apps.load(); app code never does. Test: packages/hostctl/tests/test_apps.py.
#
# [<app>]                 the app's name: also its socket folder (storage/everythingllm/<app>/)
#                         and its hostctl commands (uv run hostctl <app>-setup, <app>-logs)
# summary                 one line, for `uv run hostctl apps`
# runner                  the unit serving storage/everythingllm/<app>/runner.sock (hostrpc):
#                         one of its units, or its container's <x>.service
# units                   host user units: unit -> label (enabled and restarted by setup,
#                         checked by health)
# timers                  timers setup enables and starts
# watch                   more units health and logs follow, which setup leaves alone
#                         (a timer's service): unit -> label
# container               Quadlet containers: journal name (systemd-<x>) -> label; each one's
#                         template is host/quadlet/<x>.container.in, its unit <x>.service
#                         (restarted by setup; Quadlet's [Install] enables it). A template
#                         mustn't set ContainerName=: systemd-<x> is what the journal knows
#                         it by. One with an egress-net address is a service container
#                         (README, "Service containers")
# managed = false         deployed by something else (no template here)
# before                  commands setup runs first, from the repo's root with hostctl on PYTHONPATH
# guard                   restarts wait while a run is going: {runs (under the data dir), noun}
# serve                   the HTTPS routes the machine must provide, from the host (tailscale
#                         serve, Caddy, …): {https, port, path?}, https://<PUBLIC_HOST>:<https><path>
#                         -> http://127.0.0.1:<port>; `uv run hostctl routes` lists and checks them
# health                  name -> URL that should answer below 500
# install                 whether `uv run hostctl install` sets it up; why_not_installed says why not

[anythingllm]
summary = "AnythingLLM, in its Quadlet container (127.0.0.1:3001; units restart it)"
container = { "systemd-anythingllm" = "AnythingLLM" }
serve = [{ https = 3001, port = 3001 }]
health = { "AnythingLLM" = "http://127.0.0.1:3001/api/ping" }

[searxng]
summary = "SearXNG, the web search the agent and research use (deployed by Ansible, not this repo)"
managed = false
container = { "systemd-searxng" = "SearXNG" }
serve = [{ https = 8888, port = 8888 }]

[pages]
summary = "the pages site (Caddy): the Zola sites on :8445 and the workspaces' /public on :8447"
container = { "systemd-static_agent" = "pages site (Caddy)" }
serve = [{ https = 8445, port = 8445 }, { https = 8447, port = 8447 }]
health = { "pages site" = "http://127.0.0.1:8445/research/", "workspace pages" = "http://127.0.0.1:8447/" }

[sandbox]
summary = "the code sandbox's runner and its image; its runs reach PyPI through the egress proxy"
runner = "sandbox-runner.service"
units = { "sandbox-runner.service" = "code sandbox runner" }
before = ["python3 -m hostctl sandbox-images"]
install = true

[egress]
summary = "the egress proxy: the service containers' only way out of egress-net, to what egress.toml allows each"
container = { "systemd-egress-proxy" = "egress proxy" }
before = ["python3 -m hostctl service-images"]
# Restarting the proxy cuts every tunnel, research's model and page requests among them.
guard = { runs = "research/runs", noun = "Deep-research runs (their requests go through the proxy)" }
install = true

[browser]
summary = "browser-runner: a Chromium per workspace in a hardened container on egress-net, its live cards (:8445/_live/browser) and take-over view (https :8454)"
runner = "browser-runner.service"
units = { "browser-runner.service" = "browser runner" }
before = ["python3 -m hostctl browser-images"]
serve = [{ https = 8445, path = "/_live/browser", port = 8453 }, { https = 8454, port = 8454 }]
health = { "browser live cards" = "http://127.0.0.1:8453/_live/browser/bw-0000000000000000.jpg", "browser take-over view" = "http://127.0.0.1:8454/health" }
install = true

[research]
summary = "research-runner, in its service container, which runs deep research for the skill (live cards at :8445/_live/research)"
runner = "research-runner.service"
container = { "systemd-research-runner" = "deep-research runner" }
before = ["python3 -m hostctl.relay_env", "python3 -m hostctl service-images"]
guard = { runs = "research/runs", noun = "Deep-research runs" }
serve = [{ https = 8445, path = "/_live/research", port = 8450 }]
health = { "research live cards" = "http://127.0.0.1:8450/_live/research/dr-00000000.png" }
install = true

[agents]
summary = "agents-runner, which runs delegations (live cards at :8445/_live/agents)"
runner = "agents-runner.service"
units = { "agents-runner.service" = "delegation runner" }
before = ["python3 -m hostctl.agents_env"]
guard = { runs = "agents/runs", noun = "Delegations" }
serve = [{ https = 8445, path = "/_live/agents", port = 8451 }]
health = { "delegation live cards" = "http://127.0.0.1:8451/_live/agents/dg-00000000.png" }
why_not_installed = "it needs a developer API key in ~/.config/everythingllm/agents.env first"

[sites]
summary = "sites-runner, in its container: writes the sites' entries and has the sandbox build them"
runner = "sites-runner.service"
container = { "systemd-sites-runner" = "sites runner" }
before = ["python3 -m hostctl service-images"]
install = true

[relay]
summary = "the Nilson relay, in its service container, beside AnythingLLM at https :3001/everythingllm/"
container = { "systemd-relay" = "Nilson relay" }
before = ["python3 -m hostctl.relay_env", "python3 -m hostctl service-images"]
serve = [{ https = 3001, path = "/everythingllm", port = 8446 }]
health = { "Nilson relay" = "http://127.0.0.1:8446/health" }
why_not_installed = "it's only for the Nilson app"

[gateway]
summary = "the MCP gateway: the runners' MCP tools for clients other than AnythingLLM (https :8452)"
units = { "gateway.service" = "MCP gateway" }
before = ["python3 -m hostctl.gateway_env"]
serve = [{ https = 8452, port = 8452 }]
health = { "MCP gateway" = "http://127.0.0.1:8452/health" }
why_not_installed = "it opens the runners to other MCP clients on the network, so it's set up when one is wanted"
