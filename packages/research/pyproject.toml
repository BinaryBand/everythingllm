[project]
name = "research"
version = "0.1.0"
description = "Deep research on the host: plans a question, researches it with parallel workers over SearXNG, and writes a cited report"
requires-python = ">=3.12"
dependencies = ["chatimage", "httpx>=0.27", "hostenv", "hostrpc", "llm", "pillow>=11", "publicweb", "runs"]

[project.scripts]
research-runner = "research.runner:main"
research-run = "research.job:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
