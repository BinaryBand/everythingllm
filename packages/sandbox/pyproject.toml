[project]
name = "sandbox"
version = "0.1.0"
description = "Host daemon that runs the agent's code in podman sandboxes and publishes what it makes to the pages site"
requires-python = ">=3.12"
dependencies = ["chatimage", "egress", "hostenv", "hostrpc", "llm"]

[project.scripts]
sandbox-runner = "sandbox.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
