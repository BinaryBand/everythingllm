<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<style>
:root{--bg:oklch(0.982 0.008 75);--panel:oklch(0.995 0.003 75);--panel2:oklch(0.989 0.006 75);--hover:oklch(0.925 0.016 75);--line:oklch(0.895 0.014 75);--line2:oklch(0.928 0.012 75);--ink:oklch(0.27 0.025 280);--muted:oklch(0.5 0.02 280);--accent:oklch(0.52 0.16 272);--onaccent:oklch(1 0 0);--ok:oklch(0.62 0.14 160);--bad:oklch(0.47 0.16 20);color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:oklch(0.215 0.018 280);--panel:oklch(0.26 0.02 280);--panel2:oklch(0.235 0.019 280);--hover:oklch(0.29 0.02 280);--line:oklch(0.36 0.022 280);--line2:oklch(0.31 0.02 280);--ink:oklch(0.93 0.01 75);--muted:oklch(0.72 0.018 280);--accent:oklch(0.78 0.1 272);--onaccent:oklch(0.2 0.03 280);--ok:oklch(0.72 0.14 160);--bad:oklch(0.83 0.085 20)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:22px}
h1{align-self:flex-start;margin:0;font-size:22px;line-height:1.25}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phases{align-self:stretch;display:flex;padding:3px;border-radius:14px;background:var(--hover)}
.phases button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;color:var(--ink);font-size:14px}
.phases button[aria-pressed=true]{background:var(--panel);font-weight:600}
.ring{width:248px;height:248px;border-radius:50%;display:grid;place-items:center}
.dial{width:224px;height:224px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#clock{font:500 56px/1 ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#phase{font-size:14px;color:var(--muted)}
.buttons{display:flex;gap:10px}
#go{min-width:120px;min-height:44px;padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:var(--onaccent);font-weight:500}
#reset{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font-weight:500}
.sessions{align-self:stretch;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.sessions div{flex:1;min-width:0}
.sessions b{display:block;font-weight:500}
.sessions small{display:block;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border:1.5px solid var(--accent);border-radius:50%}
.dots i.on{background:var(--accent)}
#status{align-self:flex-start;margin:0;min-height:20px;font-size:13px;color:var(--muted)}
#status.ok::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--ok)}
#status.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1 id="title">Pomodoro</h1>
  <div class="phases" role="group" aria-label="Phase">
    <button id="p-focus" type="button"></button>
    <button id="p-break" type="button"></button>
  </div>
  <div class="ring" id="ring">
    <div class="dial" role="timer" id="dial">
      <span id="clock">25:00</span>
      <span id="phase"></span>
    </div>
  </div>
  <div class="buttons">
    <button id="go" type="button">Start</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <div class="sessions">
    <div><b id="count"></b><small id="rule"></small></div>
    <span class="dots" id="dots" aria-hidden="true"></span>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="app.js"></script>
<script>
"use strict";
// The pomodoro starter (sandbox.apps.STARTERS): data {"focus": 25, "rest": 5 (minutes),
// "phase": "focus" | "break", "endsAt": ms | null, "left": seconds, "log": [ms]}. What
// outlasts the page is a time, not a count: while it runs, endsAt is when the phase ends
// and the page works the clock out from Date.now(); stopped, left is what remains. log
// holds when each focus session ended. Whichever page sees a phase end first settles it,
// with a test of endsAt, so two open pages count it once. Each change writes the card too.
// The agent may change this page freely, or the lengths in the data.
App.start(/*APP*/null);
const byId = (id) => document.getElementById(id);
const LATE = 90 * 1000; // a phase that ended unwatched this long stops at the next one

const lengthOf = (phase) => (phase === "focus" ? App.data.focus : App.data.rest) * 60;
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const hhmm = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const sameDay = (ms) => new Date(ms).toDateString() === new Date().toDateString();
const sessionsToday = (log = App.data.log) => log.filter(sameDay).length;
const sessionsText = (n) => (n === 1 ? "1 focus session today" : `${n} focus sessions today`);
const secondsLeft = () => {
  const d = App.data;
  return d.endsAt === null ? d.left : Math.max(0, Math.ceil((d.endsAt - Date.now()) / 1000));
};

function cardFor(phase, endsAt, left, count) {
  const name = phase === "focus" ? "Focus" : "Break";
  const state = endsAt !== null ? `Until ${hhmm(endsAt)}`
    : left === lengthOf(phase) ? `${Math.round(left / 60)} minutes, ready` : `Paused, ${mmss(left)} left`;
  return { summary: name, lines: [state, sessionsText(count)] };
}

function draw() {
  const d = App.data;
  const left = secondsLeft();
  const len = lengthOf(d.phase);
  const count = sessionsToday();
  document.title = `${mmss(left)} · ${App.title}`;
  byId("title").textContent = App.title;
  byId("p-focus").textContent = `Focus · ${d.focus}`;
  byId("p-break").textContent = `Break · ${d.rest}`;
  byId("p-focus").setAttribute("aria-pressed", String(d.phase === "focus"));
  byId("p-break").setAttribute("aria-pressed", String(d.phase === "break"));
  byId("clock").textContent = mmss(left);
  byId("phase").textContent = (d.phase === "focus" ? "Focus" : "Break") + (d.endsAt === null ? " · paused" : "");
  byId("dial").setAttribute("aria-label", `${mmss(left)} left in this ${d.phase === "focus" ? "focus session" : "break"}`);
  byId("ring").style.background = `conic-gradient(var(--accent) ${((1 - left / len) * 360).toFixed(1)}deg, var(--line2) 0)`;
  byId("go").textContent = d.endsAt !== null ? "Pause" : left === len ? "Start" : "Resume";
  byId("count").textContent = sessionsText(count);
  byId("rule").textContent = `${d.focus} minutes of focus, then a ${d.rest}-minute break.`;
  const filled = count > 0 && count % 4 === 0 ? 4 : count % 4;
  byId("dots").replaceChildren(...[0, 1, 2, 3].map((i) => {
    const dot = document.createElement("i");
    if (i < filled) dot.className = "on";
    return dot;
  }));
}

// Every change sets the phase, when it ends (or null) and what is left, and the card.
function put(state, extra = []) {
  const { phase, endsAt, left } = state;
  const count = sessionsToday() + extra.filter((o) => o.path === "/log/-").length;
  change([
    ...(state.guard || []),
    ...extra,
    { op: "replace", path: "/phase", value: phase },
    { op: "replace", path: "/endsAt", value: endsAt },
    { op: "replace", path: "/left", value: left },
    { op: "replace", path: "/card", value: cardFor(phase, endsAt, left, count) },
  ]);
}

function settle() {
  const d = App.data;
  const ended = d.endsAt;
  const next = d.phase === "focus" ? "break" : "focus";
  const watched = Date.now() - ended <= LATE;
  put(
    { phase: next, endsAt: watched ? ended + lengthOf(next) * 1000 : null, left: lengthOf(next),
      guard: [{ op: "test", path: "/endsAt", value: ended }] },
    d.phase === "focus" ? [{ op: "add", path: "/log/-", value: ended }] : [],
  );
}

function toggle() {
  const d = App.data;
  if (d.endsAt === null) {
    put({ phase: d.phase, endsAt: Date.now() + d.left * 1000, left: d.left, guard: [{ op: "test", path: "/endsAt", value: null }] });
  } else {
    put({ phase: d.phase, endsAt: null, left: secondsLeft(), guard: [{ op: "test", path: "/endsAt", value: d.endsAt }] });
  }
}

function pick(phase) {
  put({ phase, endsAt: null, left: lengthOf(phase) });
}

function change(ops) {
  try {
    App.patch(ops); // draws, through App.onchange
  } catch (e) {
    say(String(e.message || e), "bad");
    draw();
  }
}

function say(text, kind) {
  const status = byId("status");
  status.textContent = text;
  status.className = kind || "";
}

byId("go").addEventListener("click", toggle);
byId("reset").addEventListener("click", () => pick(App.data.phase));
byId("p-focus").addEventListener("click", () => pick("focus"));
byId("p-break").addEventListener("click", () => pick("break"));
App.onchange(draw);
App.onstatus((state, text) => say(text, state === "saved" ? "ok" : ["error", "reload", "offline"].includes(state) ? "bad" : ""));
draw();
setInterval(() => {
  const d = App.data;
  if (d.endsAt !== null && d.endsAt <= Date.now()) settle();
  else draw();
}, 500);
</script>
</body>
</html>
