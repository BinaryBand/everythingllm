<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
:root{--bg:oklch(0.982 0.008 75);--panel:oklch(0.995 0.003 75);--line2:oklch(0.928 0.012 75);--ink:oklch(0.27 0.025 280);--ink2:oklch(0.4 0.025 280);--muted:oklch(0.5 0.02 280);--accent:oklch(0.52 0.16 272);--ok:oklch(0.62 0.14 160);--bad:oklch(0.47 0.16 20);color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:oklch(0.215 0.018 280);--panel:oklch(0.26 0.02 280);--line2:oklch(0.31 0.02 280);--ink:oklch(0.93 0.01 75);--ink2:oklch(0.81 0.014 75);--muted:oklch(0.72 0.018 280);--accent:oklch(0.78 0.1 272);--ok:oklch(0.72 0.14 160);--bad:oklch(0.83 0.085 20)}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--panel);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 20px 32px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:22px;font-weight:600;line-height:1.25}
header p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;border:0;border-radius:16px;background:none}
.dial{width:100px;height:100px;border-radius:50%;display:grid;place-items:center}
.dial span{width:86px;height:86px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.dial b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ring.full .dial b{color:var(--accent)}
.dial small{font-size:12px;color:var(--muted)}
.ring>b{font-weight:500;overflow-wrap:anywhere;text-align:center}
.ring>small{margin-top:-8px;font-size:12.5px;color:var(--muted)}
.ring>small.on{color:var(--accent)}
.empty{margin:0;padding:24px 0;text-align:center;color:var(--muted)}
.history{border-top:1px solid var(--line2);padding-top:6px;display:flex;flex-direction:column;gap:12px}
#more{align-self:flex-start;min-height:44px;padding:0;border:0;background:none;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
#more svg{transition:transform .15s}
#more[aria-expanded=true] svg{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,28px);gap:6px;align-items:center}
.grid .head{font-size:11.5px;color:var(--muted);text-align:center}
.grid .name{grid-row:span 2;font-size:15px;overflow-wrap:anywhere}
.grid i{width:28px;height:28px;border-radius:8px;background:var(--line2)}
.grid i.today{outline:2px solid var(--ink2);outline-offset:-2px}
#status{margin:0;min-height:20px;font-size:13px;color:var(--muted)}
#status.ok::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--ok)}
#status.bad{color:var(--bad)}
@media (prefers-reduced-motion: reduce){#more svg{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Habits</h1>
    <p id="left"></p>
  </header>
  <div class="rings" id="rings"></div>
  <p class="empty" id="empty" hidden>No habits yet. Ask in the chat to add one.</p>
  <div class="history" id="history">
    <button id="more" type="button" aria-expanded="false" aria-controls="grid"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg><span>The last two weeks</span></button>
    <div class="grid" id="grid" hidden></div>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="app.js"></script>
<script>
"use strict";
// The tracker starter (sandbox.apps.STARTERS): data {"habits": [{"id", "name", "target",
// "step"?, "unit"?, "days": {"2026-10-10": 5}}]}: each habit has a daily target (1 for
// done or not), step is what a tap adds (1 if left out), unit what it counts ("glasses",
// none for a target of 1), and days how much was done each day, by date in the viewer's
// own calendar. One tap on a ring adds a step, and on a full one starts the day over; the
// last two weeks are the only second level. Habits are added in the chat (up to five fit).
// The agent may change this page freely.
App.start(/*APP*/null);
const byId = (id) => document.getElementById(id);
const INITIAL = ["S", "M", "T", "W", "T", "F", "S"];
let history = false;

const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
const target = (h) => Math.max(1, Number(h.target) || 1);
const done = (h, key) => Number((h.days || {})[key]) || 0;
const met = (h, key) => done(h, key) >= target(h);

function streak(h) {
  let n = 0;
  for (let back = met(h, dayKey(ago(0))) ? 0 : 1; met(h, dayKey(ago(back))); back++) n++;
  return n;
}

function draw() {
  const habits = App.data.habits;
  const today = dayKey(ago(0));
  document.title = App.title;
  byId("title").textContent = App.title;
  const count = habits.filter((h) => met(h, today)).length;
  byId("left").textContent = !habits.length ? ""
    : count === habits.length ? "All done today" : `${count} of ${habits.length} done today`;
  byId("rings").replaceChildren(...habits.map((h, i) => ring(h, i, today)));
  byId("empty").hidden = habits.length > 0;
  byId("history").hidden = !habits.length;
  byId("more").setAttribute("aria-expanded", String(history));
  byId("more").lastChild.textContent = history ? "Hide the last two weeks" : "The last two weeks";
  byId("grid").hidden = !history;
  if (history) drawGrid(habits);
}

function ring(h, i, today) {
  const n = done(h, today);
  const goal = target(h);
  const full = n >= goal;
  const step = Math.max(1, Number(h.step) || 1);
  const run = streak(h);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ring" + (full ? " full" : "");
  b.setAttribute("aria-label", goal === 1
    ? `${h.name}: ${full ? "done" : "not yet"} today. ${full ? "Tap to start over." : "Tap when done."}`
    : `${h.name}: ${n} of ${goal}${h.unit ? " " + h.unit : ""}. ${full ? "Tap to start over." : `Tap to add ${step}.`}`);
  const dial = document.createElement("span");
  dial.className = "dial";
  dial.style.background = `conic-gradient(var(--accent) ${(Math.min(1, n / goal) * 360).toFixed(1)}deg, var(--line2) 0)`;
  const inner = document.createElement("span");
  const big = document.createElement("b");
  big.textContent = goal === 1 ? (full ? "Done" : "Not yet") : `${n}/${goal}`;
  inner.append(big);
  if (goal > 1 && h.unit) {
    const unit = document.createElement("small");
    unit.textContent = h.unit;
    inner.append(unit);
  }
  dial.append(inner);
  const name = document.createElement("b");
  name.textContent = h.name;
  const meta = document.createElement("small");
  meta.textContent = run ? `${run}-day streak` : "No streak yet";
  if (run) meta.className = "on";
  b.append(dial, name, meta);
  b.addEventListener("click", () => tap(h, i, today, full ? 0 : Math.min(goal, n + step)));
  return b;
}

function drawGrid(habits) {
  const cells = [document.createElement("span")];
  for (let back = 6; back >= 0; back--) {
    const head = document.createElement("span");
    head.className = "head";
    head.textContent = INITIAL[ago(back).getDay()];
    cells.push(head);
  }
  const days = Array.from({ length: 14 }, (_, i) => {
    const d = ago(13 - i);
    return { key: dayKey(d), label: d.toLocaleDateString([], { day: "numeric", month: "short" }) };
  });
  for (const h of habits) {
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = h.name;
    cells.push(name);
    for (const [i, day] of days.entries()) {
      const f = Math.min(1, done(h, day.key) / target(h));
      const cell = document.createElement("i");
      if (i === 13) cell.className = "today";
      if (f > 0) {
        cell.style.background = "var(--accent)";
        cell.style.opacity = f >= 1 ? "1" : String(0.45 + 0.25 * Math.min(1, f / 0.75));
      }
      cell.title = `${day.label}: ${Math.round(100 * f)}%`;
      cells.push(cell);
    }
  }
  byId("grid").replaceChildren(...cells);
}

// Today's count for one habit, guarded by its id (its place may have moved) and by the
// count the page saw, so two open pages don't both add a step on top of the same one.
function tap(h, i, today, value) {
  const ops = [{ op: "test", path: `/habits/${i}/id`, value: h.id }];
  if (!h.days || typeof h.days !== "object") ops.push({ op: "add", path: `/habits/${i}/days`, value: {} });
  else if (today in h.days) ops.push({ op: "test", path: `/habits/${i}/days/${today}`, value: h.days[today] });
  ops.push({ op: "add", path: `/habits/${i}/days/${today}`, value });
  change(ops);
}

function change(ops) {
  try {
    App.patch(ops); // draws, through App.onchange
  } catch (e) {
    say(String(e.message || e), "bad");
    draw();
  }
}

function say(text, kind) {
  const status = byId("status");
  status.textContent = text;
  status.className = kind || "";
}

byId("more").addEventListener("click", () => { history = !history; draw(); });
let lastDay = dayKey(ago(0));
App.onchange(draw);
App.onstatus((state, text) => say(text, state === "saved" ? "ok" : ["error", "reload", "offline"].includes(state) ? "bad" : ""));
draw();
setInterval(() => { // a new day: redraw
  if (dayKey(ago(0)) !== lastDay) { lastDay = dayKey(ago(0)); draw(); }
}, 30000);
</script>
</body>
</html>
