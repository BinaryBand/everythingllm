[project]
name = "sites"
version = "0.1.0"
description = "MCP server for the Zola sites' entries, and the host service that builds the sites"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "pydantic>=2", "hostrpc"]

[project.optional-dependencies]
# What sites-runner needs on the host beyond what the MCP server (the front) imports.
host = ["chatimage"]

[project.scripts]
sites-mcp = "sites.server:mcp.run"
sites-runner = "sites.tools:main"
sites-build = "sites.build:main"
sites-write = "sites.write:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
