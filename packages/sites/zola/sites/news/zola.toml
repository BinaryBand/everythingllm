# Overridden on every build with https://<PUBLIC_HOST>:8445/news from host.env (see sites.build).
base_url = "http://127.0.0.1:8445/news"
title = "Daily News"
description = "US, Sweden and World headlines, compiled every day from news feeds."
theme = "agent-site"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[extra]
stylesheets = ["news.css"]
nav = [{ name = "Archive", path = "@/editions/_index.md" }]
footer = "Compiled automatically from news feeds."
# Where headlines link: the article writer (sites.articles_web, in sites-runner), routed here by the machine (apps.toml).
article_writer = "/news/write"

# Shown to the agent by the sites MCP server's list_sites.
agent_help = """
One entry per day in section "editions": slug "YYYY-MM-DD", title "Daily News — Month D, YYYY",
date "YYYY-MM-DD". Put the stories in extra, most important first, up to 5 per section:
{"sections": [{"name": "US", "stories": [{"headline": "...", "summary": "One sentence.",
"source": "AP News", "url": "https://..."}]}, {"name": "Sweden", ...}, {"name": "World", ...}]}
Leave url out if you have none; give a section an empty stories list if nothing was found.
No body. The home page always shows the newest edition; older ones stay in the archive.
Section "articles" is filled in by the article writer when a reader opens a story.
"""

# Built in the sandbox with this theme (see sites.build): "system" is the repo's
# packages/sites/zola/themes; a sandbox workspace's name takes the theme from its /shared/<name>/themes.
[extra.build]
theme_from = "system"
