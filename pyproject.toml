# uv workspace for the MCP servers, host services and libraries: one member per packages/
# subdirectory, all locked in uv.lock. `uv sync --all-packages` puts the dev venv at .venv,
# where editors look.
[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/.*", "packages/__pycache__"]

# For every member: a member that others depend on is found here, in the workspace, and
# pytest comes with the dev group (splice adds its test-only dependencies to it).
[tool.uv.sources]
chatimage = { workspace = true }
hostrpc = { workspace = true }
llm = { workspace = true }
publicweb = { workspace = true }
runs = { workspace = true }
sandbox = { workspace = true }
sites = { workspace = true }
splice = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

# Makes the repo root pytest's rootdir however tests are picked (`pytest packages/sites`, a
# single file), so packages/conftest.py, which keeps host.env out of the tests, always loads.
# One ruff cache at the root, wherever ruff is run from.
[tool.ruff]
cache-dir = ".ruff_cache"

[tool.pytest.ini_options]
testpaths = ["packages"]

# An MCP server's tools are signatures whose bodies hostrpc.forwarder supplies.
[[tool.ty.overrides]]
include = ["packages/*/src/*/server.py"]
rules = { empty-body = "ignore" }
