[project]
name = "splice"
version = "0.1.0"
description = "Serve an MP3 with stretches left out, as byte ranges of the untouched original, plus the static files beside it"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
splice-web = "splice.web:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28,<0.29", "numpy>=2", "av>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
