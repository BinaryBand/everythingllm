# Overridden on every build with https://<PUBLIC_HOST>:8445/status from host.env (see sites.build).
base_url = "http://127.0.0.1:8445/status"
title = "System Status"
description = "Daily audit of the AnythingLLM setup: service logs, web search, scheduled jobs, deep research and the sites."
theme = "agent-site"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[extra]
stylesheets = ["status.css"]
nav = [{ name = "Archive", path = "@/reports/_index.md" }]
footer = "Written by the System Audit job from the audit MCP server's checks."

# Shown to the agent by the sites MCP server's list_sites.
agent_help = """
Read-only: the audit MCP server's publish_report writes one report per day (Stockholm date) in
section "reports", slug "YYYY-MM-DD", title "System audit — Month D, YYYY — <what it found>" (the counts are in the title
because the stylesheet can restyle the page but not the browser tab or the feed). Fields in extra:
{"status": "ok" | "warn" | "fail", "summary": "One or two sentences.",
 "findings": [{"severity": "fail" | "warn" | "info", "area": "logs|search|sandbox|llm|jobs|research|sites|services",
   "title": "...", "detail": "what was observed", "suggestion": "likely cause and what to do"}]}
"""

# Built in the sandbox with this theme (see sites.build): "system" is the repo's
# zola/themes; a sandbox workspace's name takes the theme from its /shared/<name>/themes.
[extra.build]
theme_from = "system"
